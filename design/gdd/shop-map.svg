<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Tin Knockout GDD figure: the night map, a cross-section of the toy shop with the six arenas.
       Hand-written SVG (Claude) concept, not a generated asset. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8C35A"/>
    </marker>
    <style>
      .wood{fill:#7A4B3A;stroke:#3B2219;stroke-width:2}
      .card{fill:#1B2438;stroke:#C9962B;stroke-width:1.8;opacity:0.95}
      .n{fill:#E8C35A;font-size:12px;font-weight:800;letter-spacing:1px}
      .h{fill:#F2E6C4;font-size:14px;font-weight:700}
      .s{fill:#A9B4C8;font-size:11px}
      .badge{fill:#C8382E;stroke:#E8C35A;stroke-width:2.5}
      .bt{fill:#FFF6DA;font-size:15px;font-weight:800}
    </style>
  </defs>
  <!-- wall, floor -->
  <rect width="1000" height="640" fill="#2B2545"/>
  <rect y="600" width="1000" height="40" fill="#8E4F63"/>
  

  <!-- climb path (behind everything) -->
  <path d="M180,392 C320,420 420,440 505,450 C640,460 720,420 770,372 C700,300 600,260 520,238 C400,210 260,200 175,160 C260,90 420,60 612,66"
        fill="none" stroke="#E8C35A" stroke-width="2.5" stroke-dasharray="7 6" opacity="0.55" marker-end="url(#a)"/>

  <!-- wall clock at midnight -->
  <circle cx="80" cy="88" r="34" fill="#F2E6C4" stroke="#7A4B3A" stroke-width="6"/>
  <line x1="80" y1="88" x2="80" y2="62" stroke="#1E1A16" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="88" x2="80" y2="68" stroke="#C8382E" stroke-width="2"/>
  <circle cx="80" cy="88" r="3" fill="#1E1A16"/>
  <text x="80" y="140" fill="#A9B4C8" font-size="11" text-anchor="middle">midnight</text>

  <!-- NIGHT 5: top wall shelf with the train set -->
  <rect class="wood" x="30" y="206" width="300" height="12"/>
  <rect x="40" y="200" width="280" height="4" fill="#5B6770"/>
  <rect x="70" y="170" width="54" height="30" rx="4" fill="#3D6FB5" stroke="#1E1A16" stroke-width="2"/>
  <rect x="100" y="156" width="20" height="16" fill="#3D6FB5" stroke="#1E1A16" stroke-width="2"/>
  <rect x="76" y="160" width="10" height="12" fill="#1E1A16"/>
  <rect x="130" y="176" width="58" height="24" rx="3" fill="#C8382E" stroke="#1E1A16" stroke-width="2"/>
  <rect x="194" y="176" width="58" height="24" rx="3" fill="#E8C35A" stroke="#1E1A16" stroke-width="2"/>
  <g fill="#1E1A16"><circle cx="84" cy="200" r="5"/><circle cx="110" cy="200" r="5"/><circle cx="145" cy="200" r="5"/><circle cx="173" cy="200" r="5"/><circle cx="209" cy="200" r="5"/><circle cx="237" cy="200" r="5"/></g>
  <circle class="badge" cx="290" cy="178" r="16"/><text class="bt" x="290" y="184" text-anchor="middle">5</text>
  <rect class="card" x="40" y="226" width="280" height="64" rx="8"/>
  <text class="n" x="52" y="243">NIGHT 5 · FRI</text>
  <text class="h" x="52" y="261">The Train Set</text>
  <text class="s" x="52" y="279">vs Sputter · a tin train crosses every 12 s</text>

  <!-- NIGHT 1: the counter and the goldfish bowl -->
  <rect x="30" y="470" width="310" height="130" fill="#D98AA0" stroke="#6E3446" stroke-width="2"/>
  <rect x="24" y="462" width="322" height="12" fill="#E7A3B6" stroke="#6E3446" stroke-width="2"/>
  <ellipse cx="185" cy="420" rx="110" ry="48" fill="#BFD8F0" fill-opacity="0.25" stroke="#DDEBF7" stroke-width="3"/>
  <ellipse cx="185" cy="378" rx="78" ry="10" fill="none" stroke="#DDEBF7" stroke-width="2.5"/>
  <path d="M95,452 Q185,476 275,452 L268,462 L102,462 z" fill="#F0B27A"/>
  <path d="M125,452 l8,-26 l8,26 z M120,452 v-18 h24 v18" fill="#F29BB8" stroke="#6E3446" stroke-width="1.5"/>
  <path d="M235,452 q-6,-22 4,-34 M243,452 q4,-18 -2,-30" stroke="#4F9A4A" stroke-width="4" fill="none"/>
  <circle cx="170" cy="438" r="7" fill="#C9962B" stroke="#1E1A16" stroke-width="1.5"/><rect x="164" y="444" width="12" height="10" fill="#C8382E"/>
  <circle cx="200" cy="438" r="7" fill="#B5652F" stroke="#1E1A16" stroke-width="1.5"/><rect x="194" y="444" width="12" height="10" fill="#3F8F7A"/>
  <circle class="badge" cx="300" cy="400" r="16"/><text class="bt" x="300" y="406" text-anchor="middle">1</text>
  <rect class="card" x="50" y="490" width="270" height="78" rx="8"/>
  <text class="n" x="62" y="507">NIGHT 1 · MON</text>
  <text class="h" x="62" y="525">The Goldfish Bowl</text>
  <text class="s" x="62" y="543">vs Rivet · tutorial · built in the slice</text>
  <text class="s" x="62" y="558">learn: spend, back off, rewind</text>

  <!-- the tall cabinet: nights 2, 4, 6 -->
  <rect class="wood" x="370" y="150" width="270" height="450"/>
  <rect x="384" y="164" width="242" height="164" fill="#3A2A3C"/>
  <rect x="384" y="342" width="242" height="176" fill="#3A2A3C"/>
  <rect class="wood" x="370" y="328" width="270" height="14"/>
  <rect class="wood" x="370" y="518" width="270" height="14"/>

  <!-- NIGHT 6: carousel on top -->
  <path d="M505,30 L610,92 L400,92 z" fill="#C8382E" stroke="#1E1A16" stroke-width="2"/>
  <path d="M400,92 q13,12 26,0 q13,12 26,0 q13,12 26,0 q13,12 26,0 q13,12 26,0 q13,12 26,0 q13,12 26,0 q13,12 26,0" fill="#F2E6C4" stroke="#1E1A16" stroke-width="1.5"/>
  <g stroke="#E8C35A" stroke-width="3"><line x1="430" y1="100" x2="430" y2="142"/><line x1="480" y1="100" x2="480" y2="142"/><line x1="530" y1="100" x2="530" y2="142"/><line x1="580" y1="100" x2="580" y2="142"/></g>
  <path d="M418,124 h24 l4,-8 l4,8 v8 h-32 z M518,118 h24 l4,-8 l4,8 v8 h-32 z" fill="#F2E6C4" stroke="#1E1A16" stroke-width="1.5"/>
  <rect x="392" y="140" width="226" height="10" fill="#E8C35A" stroke="#1E1A16" stroke-width="2"/>
  <circle class="badge" cx="632" cy="70" r="16"/><text class="bt" x="632" y="76" text-anchor="middle">6</text>
  <rect class="card" x="140" y="24" width="240" height="78" rx="8"/>
  <text class="n" x="152" y="41">NIGHT 6 · SAT</text>
  <text class="h" x="152" y="59">The Carousel</text>
  <text class="s" x="152" y="77">vs the Ringmaster · boss, 3 phases</text>
  <text class="s" x="152" y="92">horses sweep past, block corks</text>

  <!-- NIGHT 4: music box on the middle shelf -->
  <rect x="438" y="282" width="134" height="46" fill="#7E3F8F" stroke="#1E1A16" stroke-width="2"/>
  <path d="M438,282 L452,236 L586,236 L572,282 z" fill="#9C56AD" stroke="#1E1A16" stroke-width="2"/>
  <rect x="438" y="296" width="134" height="6" fill="#E8C35A"/>
  <ellipse cx="505" cy="270" rx="18" ry="4" fill="#F29BB8" stroke="#1E1A16" stroke-width="1"/>
  <line x1="505" y1="282" x2="505" y2="252" stroke="#F0C9A0" stroke-width="3"/>
  <circle cx="505" cy="248" r="5" fill="#F0C9A0" stroke="#1E1A16" stroke-width="1"/>
  <path d="M498,256 q7,-18 14,0" stroke="#F0C9A0" stroke-width="2" fill="none"/>
  <circle class="badge" cx="600" cy="300" r="16"/><text class="bt" x="600" y="306" text-anchor="middle">4</text>
  <rect class="card" x="392" y="172" width="226" height="56" rx="8"/>
  <text class="n" x="404" y="190">NIGHT 4 · THU</text>
  <text class="h" x="404" y="208">The Music Box</text>
  <text class="s" x="404" y="222">vs Pirouette · the floor turns</text>

  <!-- NIGHT 2: toy soldier fort on the bottom shelf -->
  <path d="M430,518 V470 h14 v-10 h14 v10 h14 v-10 h14 v10 h14 v-10 h14 v10 h28 v-10 h14 v10 h14 v-10 h14 v10 h14 v-10 h14 v10 V518 z" fill="#C9B79A" stroke="#1E1A16" stroke-width="2"/>
  <rect x="490" y="488" width="30" height="30" rx="14" fill="#3A2A3C"/>
  <g><rect x="448" y="496" width="8" height="22" fill="#2F4A8A"/><rect x="447" y="484" width="10" height="12" fill="#C8382E"/>
     <rect x="550" y="496" width="8" height="22" fill="#2F4A8A"/><rect x="549" y="484" width="10" height="12" fill="#C8382E"/></g>
  <circle class="badge" cx="610" cy="480" r="16"/><text class="bt" x="610" y="486" text-anchor="middle">2</text>
  <rect class="card" x="392" y="356" width="226" height="66" rx="8"/>
  <text class="n" x="404" y="374">NIGHT 2 · TUE</text>
  <text class="h" x="404" y="392">Toy Soldier Fort</text>
  <text class="s" x="404" y="410">vs Clatter · soldiers march through</text>

  <!-- NIGHT 3: the window, the ledge, the cat -->
  <rect x="690" y="56" width="280" height="330" fill="#2E4A72" stroke="#7A4B3A" stroke-width="10"/>
  <line x1="830" y1="56" x2="830" y2="386" stroke="#7A4B3A" stroke-width="7"/>
  <line x1="690" y1="210" x2="970" y2="210" stroke="#7A4B3A" stroke-width="7"/>
  <circle cx="905" cy="118" r="28" fill="#F5EBC8"/>
  <circle cx="916" cy="110" r="25" fill="#2E4A72"/>
  <g stroke="#9DB8DA" stroke-width="1.5" opacity="0.7">
    <line x1="712" y1="80" x2="704" y2="104"/><line x1="752" y1="120" x2="744" y2="144"/><line x1="790" y1="74" x2="782" y2="98"/>
    <line x1="728" y1="250" x2="720" y2="274"/><line x1="770" y1="300" x2="762" y2="324"/><line x1="860" y1="240" x2="852" y2="264"/>
    <line x1="900" y1="300" x2="892" y2="324"/><line x1="940" y1="250" x2="932" y2="274"/><line x1="860" y1="160" x2="852" y2="184"/>
  </g>
  <rect x="712" y="222" width="236" height="34" fill="#F2E6C4" stroke="#C8382E" stroke-width="3" transform="rotate(-4 830 239)"/>
  <text x="830" y="236" fill="#C8382E" font-size="15" font-weight="800" text-anchor="middle" transform="rotate(-4 830 239)">CLOSING DOWN</text>
  <text x="830" y="251" fill="#C8382E" font-size="9.5" font-weight="700" text-anchor="middle" transform="rotate(-4 830 239)">EVERYTHING MUST GO · SUNDAY</text>
  <rect class="wood" x="670" y="386" width="320" height="16"/>
  <!-- Mothball the cat, asleep on the ledge -->
  <path d="M880,386 q-6,-34 26,-40 q14,-14 24,-2 l6,-12 l4,14 q14,6 12,40 z" fill="#14121C"/>
  <path d="M884,386 q-30,0 -26,-14" stroke="#14121C" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M916,352 q4,3 8,0" stroke="#E8C35A" stroke-width="1.5" fill="none"/>
  <!-- Hopper, tiny -->
  <ellipse cx="760" cy="378" rx="13" ry="8" fill="#4F9A4A" stroke="#1E1A16" stroke-width="1.5"/>
  <circle cx="766" cy="368" r="4" fill="#4F9A4A" stroke="#1E1A16" stroke-width="1.5"/>
  <circle class="badge" cx="720" cy="360" r="16"/><text class="bt" x="720" y="366" text-anchor="middle">3</text>
  <rect class="card" x="690" y="418" width="280" height="78" rx="8"/>
  <text class="n" x="702" y="435">NIGHT 3 · WED</text>
  <text class="h" x="702" y="453">The Window Ledge</text>
  <text class="s" x="702" y="471">vs Hopper · rain on the glass</text>
  <text class="s" x="702" y="486">hazard: Mothball the cat's paw</text>

  <text x="24" y="627" fill="#FFF6DA" font-size="17" font-weight="700" letter-spacing="2">THE MIDNIGHT CIRCUIT · ONE SHELF HIGHER EACH NIGHT</text>
  <text x="980" y="626" fill="#FFF6DA" font-size="11" text-anchor="end" opacity="0.85">dashed line = the order you climb</text>
</svg>
